services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./out:/app/out
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
